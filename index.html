<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokélab</title>
<link rel="icon" type="image/png" href="ball.png">
<link rel="apple-touch-icon" href="ball.png">
<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --sub:#6b6b6b;
    --border:#dcdcdc;
    --border-strong:#111111;
    --btn-dark:#595959;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  #page{
    width:100%;
    max-width:440px;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:9vh 28px 32px;
  }
  h1{
    text-align:center;
    font-size:2.2rem;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 12vh;
    color:var(--text);
  }
  nav{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .nav-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:22px 20px;
    border:1.5px solid var(--border-strong);
    border-radius:14px;
    background:#fff;
    color:var(--text);
    font-size:1.05rem;
    font-weight:600;
    text-decoration:none;
    text-align:center;
    line-height:1.4;
    transition:background .15s ease,color .15s ease,border-color .15s ease,transform .1s ease;
  }
  .nav-btn:active{transform:scale(0.98)}
  @media (hover:hover){
    .nav-btn:hover{background:var(--btn-dark);border-color:var(--btn-dark);color:#fff}
  }
  footer{
    margin-top:auto;
    padding-top:10vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  #greet{
    font-size:.8rem;
    color:var(--sub);
    min-height:1em;
  }
  .footer-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #loginBtn,#userChangePwBtn,#userDeleteBtn{
    padding:9px 22px;
    border:1px solid var(--border);
    border-radius:999px;
    background:#fff;
    color:var(--sub);
    font-size:.82rem;
    font-weight:500;
    cursor:pointer;
    font-family:inherit;
  }
  #loginBtn:hover,#userChangePwBtn:hover,#userDeleteBtn:hover{border-color:var(--border-strong);color:var(--text)}

  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:10;padding:24px}
  .modal .box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15)}
  .modal h2{font-size:17px;margin:0 0 16px;font-weight:700;color:var(--text)}
  .modal input{width:100%;background:#fafafa;border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:11px 12px;margin-bottom:10px;outline:none;font-family:inherit}
  .modal input:focus{border-color:var(--border-strong)}
  .modal button.primary{margin-top:6px;background:var(--btn-dark);border:none;border-radius:10px;padding:11px 24px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;width:100%;font-family:inherit}
  .modal button.secondary{background:transparent;border:none;color:var(--sub);margin-top:10px;font-size:13px;cursor:pointer;width:100%;font-family:inherit}

  #adminPanel{display:none;width:100%;max-width:480px;min-height:100vh;min-height:100dvh;flex-direction:column;padding:6vh 24px 32px;margin:0 auto}
  #adminPanel h1{text-align:center;font-size:1.6rem;font-weight:800;margin:0 0 24px}
  .admin-card{border:1.5px solid var(--border-strong);border-radius:14px;padding:18px;margin-bottom:18px}
  .admin-card h3{margin:0 0 12px;font-size:.95rem;font-weight:700}
  .admin-card input{width:100%;background:#fafafa;border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:10px 12px;margin-bottom:8px;outline:none;font-family:inherit}
  .admin-card input:focus{border-color:var(--border-strong)}
  .primary-btn{background:var(--btn-dark);border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;width:100%;font-family:inherit;margin-top:4px}
  .admin-msg{font-size:.78rem;color:var(--sub);margin-top:8px;min-height:1em}
  .admin-note{font-size:.72rem;color:var(--sub);margin-bottom:12px;line-height:1.5}
  .admin-note.danger{color:#d32f2f}
  .admin-sub{font-size:.78rem;color:var(--sub);font-weight:400}
  .admin-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
  .admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .admin-row .who{display:flex;flex-direction:column;gap:2px}
  .admin-row .who b{font-size:.85rem}
  .admin-row .who span{font-size:.7rem;color:var(--sub)}
  .admin-row button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;font-size:.72rem;cursor:pointer;font-family:inherit;flex-shrink:0}
  .admin-row button:hover{border-color:var(--border-strong)}
  .admin-row.is-disabled{opacity:.55}
  .admin-footer{margin-top:auto;padding-top:6vh;display:flex;flex-direction:column;align-items:center;gap:8px}
  .admin-footer button{padding:9px 22px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--sub);font-size:.82rem;font-weight:500;cursor:pointer;font-family:inherit}
  .admin-footer button:hover{border-color:var(--border-strong);color:var(--text)}
</style>
</head>
<body>
<div id="page">
  <h1>Pokélab</h1>
  <nav>
    <a class="nav-btn" href="https://iruroda.github.io/todayspokemon">오늘의 포켓몬은 뭘까요</a>
    <a class="nav-btn" href="https://iruroda.github.io/pokopia">Pokémon Pokopia</a>
  </nav>
  <footer>
    <div id="greet"></div>
    <div class="footer-actions">
      <button id="userChangePwBtn" type="button" style="display:none">비밀번호 변경</button>
      <button id="userDeleteBtn" type="button" style="display:none">계정 삭제</button>
      <button id="loginBtn" type="button">로그인</button>
    </div>
  </footer>
</div>

<div id="adminPanel">
  <h1>계정 관리</h1>

  <section class="admin-card">
    <h3>관리자 비밀번호 변경</h3>
    <input id="adminOldPw" type="password" placeholder="현재 비밀번호" autocomplete="current-password">
    <input id="adminNewPw" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password">
    <button class="primary-btn" id="adminChangePwBtn" type="button">비밀번호 변경</button>
    <div class="admin-msg" id="adminPwMsg"></div>
  </section>

  <section class="admin-card">
    <h3>계정 추가</h3>
    <input id="adminNewId" type="text" placeholder="새 계정 아이디" autocomplete="off">
    <input id="adminNewMemberPw" type="password" placeholder="초기 비밀번호 (6자 이상)" autocomplete="new-password">
    <button class="primary-btn" id="adminAddMemberBtn" type="button">계정 추가</button>
    <div class="admin-msg" id="adminAddMsg"></div>
  </section>

  <section class="admin-card">
    <h3>계정 목록 <span id="adminMemberCount" class="admin-sub"></span></h3>
    <div id="adminMemberList" class="admin-list"><div class="admin-sub">불러오는 중…</div></div>
  </section>

  <footer class="admin-footer">
    <button id="adminLogoutBtn" type="button">로그아웃</button>
  </footer>
</div>

<div id="loginModal" class="modal">
  <div class="box">
    <h2 id="loginTitle">로그인</h2>
    <input id="loginId" type="text" name="username" placeholder="아이디" autocomplete="username">
    <input id="loginPw" type="password" name="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="admin-msg" id="loginMsg"></div>
    <button class="primary" id="loginSubmit" type="button">로그인</button>
    <button class="secondary" id="loginCancel" type="button">닫기</button>
  </div>
</div>

<div id="pwModal" class="modal">
  <div class="box">
    <h2>비밀번호 변경</h2>
    <input id="pwOldInput" type="password" placeholder="현재 비밀번호" autocomplete="current-password">
    <input id="pwNewInput" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password">
    <button class="primary" id="pwSubmit" type="button">변경</button>
    <button class="secondary" id="pwCancel" type="button">닫기</button>
    <div class="admin-msg" id="pwMsg"></div>
  </div>
</div>

<div id="delModal" class="modal">
  <div class="box">
    <h2>계정 삭제</h2>
    <div class="admin-note danger">계정이 영구적으로 삭제됩니다. 되돌릴 수 없습니다.</div>
    <input id="delPwInput" type="password" placeholder="현재 비밀번호" autocomplete="current-password">
    <button class="primary" id="delSubmit" type="button">삭제</button>
    <button class="secondary" id="delCancel" type="button">닫기</button>
    <div class="admin-msg" id="delMsg"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// ---- 로그인: 퀴즈 페이지와 동일한 Firebase Auth 계정 체계 공유 ----
var FIREBASE_CONFIG={apiKey:"AIzaSyA1qlkS_vNnAEMhyeJxH0EHRxYrFeJXZDk",authDomain:"todayspokemon-ef9c0.firebaseapp.com",projectId:"todayspokemon-ef9c0",storageBucket:"todayspokemon-ef9c0.firebasestorage.app",messagingSenderId:"69457831977",appId:"1:69457831977:web:faeee4ba343a6c9b931438"};
var fbAuth=null, db=null;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth=firebase.auth();
  db=firebase.firestore();
}catch(e){console.warn("Firebase 초기화 실패",e)}
function idToEmail(id){
  var hex="",b=unescape(encodeURIComponent(id));
  for(var i=0;i<b.length;i++){var h=b.charCodeAt(i).toString(16);hex+=(h.length<2?"0":"")+h}
  return "u"+hex+"@todayspokemon.app";
}
var $=function(id){return document.getElementById(id)};
var curUser=localStorage.getItem("psq2curuser")||null;
var isAdminUser=false;

function updateAuthUI(){
  $("loginBtn").textContent=curUser?"로그아웃":"로그인";
  $("greet").textContent=curUser?curUser+"님, 안녕하세요.":"";
  if($("userChangePwBtn"))$("userChangePwBtn").style.display=curUser?"inline-block":"none";
  if($("userDeleteBtn"))$("userDeleteBtn").style.display=curUser?"inline-block":"none";
}
function renderMode(){
  var showAdmin=!!(curUser&&isAdminUser);
  $("page").style.display=showAdmin?"none":"flex";
  $("adminPanel").style.display=showAdmin?"flex":"none";
}
function doLogout(){
  if(fbAuth)fbAuth.signOut();
  curUser=null;localStorage.removeItem("psq2curuser");
  isAdminUser=false;
  updateAuthUI();renderMode();
}
$("loginBtn").onclick=function(){
  if(curUser){doLogout()}
  else{
    $("loginId").value="";$("loginPw").value="";$("loginMsg").textContent="";
    $("loginModal").style.display="flex";
  }
};
if($("adminLogoutBtn"))$("adminLogoutBtn").onclick=doLogout;
$("loginCancel").onclick=function(){$("loginModal").style.display="none"};
$("loginModal").onclick=function(e){if(e.target===$("loginModal"))$("loginModal").style.display="none"};

// 일반 사용자용: 내 비밀번호 변경
if($("userChangePwBtn"))$("userChangePwBtn").onclick=function(){
  $("pwOldInput").value="";$("pwNewInput").value="";$("pwMsg").textContent="";
  $("pwModal").style.display="flex";
};
if($("pwCancel"))$("pwCancel").onclick=function(){$("pwModal").style.display="none"};
if($("pwModal"))$("pwModal").onclick=function(e){if(e.target===$("pwModal"))$("pwModal").style.display="none"};
if($("pwSubmit"))$("pwSubmit").onclick=function(){
  var oldPw=$("pwOldInput").value,newPw=$("pwNewInput").value;
  var msg=$("pwMsg");
  if(!oldPw||!newPw){msg.textContent="현재/새 비밀번호를 모두 입력하세요";return}
  if(newPw.length<6){msg.textContent="새 비밀번호는 6자 이상이어야 합니다";return}
  if(!fbAuth||!fbAuth.currentUser){msg.textContent="로그인 정보가 없습니다";return}
  msg.textContent="변경 중…";
  var credential=firebase.auth.EmailAuthProvider.credential(fbAuth.currentUser.email,oldPw);
  fbAuth.currentUser.reauthenticateWithCredential(credential)
    .then(function(){return fbAuth.currentUser.updatePassword(newPw)})
    .then(function(){
      msg.textContent="비밀번호가 변경됐습니다";
      setTimeout(function(){$("pwModal").style.display="none"},900);
    })
    .catch(function(err){
      if(err&&(err.code==="auth/wrong-password"||err.code==="auth/invalid-credential"))msg.textContent="현재 비밀번호가 일치하지 않습니다";
      else msg.textContent="변경 실패: "+(err&&err.message?err.message:"오류");
    });
};

// 일반 사용자용: 계정 삭제 (본인 계정만, 실제 Firebase 계정 삭제)
if($("userDeleteBtn"))$("userDeleteBtn").onclick=function(){
  $("delPwInput").value="";$("delMsg").textContent="";
  $("delModal").style.display="flex";
};
if($("delCancel"))$("delCancel").onclick=function(){$("delModal").style.display="none"};
if($("delModal"))$("delModal").onclick=function(e){if(e.target===$("delModal"))$("delModal").style.display="none"};
if($("delSubmit"))$("delSubmit").onclick=function(){
  var pw=$("delPwInput").value;
  var msg=$("delMsg");
  if(!pw){msg.textContent="비밀번호를 입력하세요";return}
  if(!fbAuth||!fbAuth.currentUser){msg.textContent="로그인 정보가 없습니다";return}
  msg.textContent="삭제 중…";
  var user=fbAuth.currentUser;
  var credential=firebase.auth.EmailAuthProvider.credential(user.email,pw);
  user.reauthenticateWithCredential(credential)
    .then(function(){
      var uid=user.uid;
      var cleanup=db?db.collection("users").doc(uid).delete().catch(function(){}):Promise.resolve();
      return cleanup.then(function(){return user.delete()});
    })
    .then(function(){
      $("delModal").style.display="none";
      curUser=null;localStorage.removeItem("psq2curuser");
      isAdminUser=false;
      updateAuthUI();renderMode();
      alert("계정이 삭제됐습니다");
    })
    .catch(function(err){
      if(err&&(err.code==="auth/wrong-password"||err.code==="auth/invalid-credential"))msg.textContent="비밀번호가 일치하지 않습니다";
      else msg.textContent="삭제 실패: "+(err&&err.message?err.message:"오류");
    });
};

// 로그인/계정 생성 성공 후: Firestore에 이름·마지막 접속 기록, 비활성 계정 차단, 관리자 여부 판별
function afterAuthSuccess(id, uid){
  if(!db){
    curUser=id;localStorage.setItem("psq2curuser",id);
    updateAuthUI();renderMode();
    return Promise.resolve();
  }
  var ref=db.collection("users").doc(uid);
  return ref.get().then(function(doc){
    if(doc.exists&&doc.data().disabled===true){
      return fbAuth.signOut().then(function(){
        return Promise.reject({code:"app/disabled",message:"관리자에 의해 비활성화된 계정입니다."});
      });
    }
    var payload={name:id,lastLogin:firebase.firestore.FieldValue.serverTimestamp()};
    if(!doc.exists){
      payload.disabled=false;
      payload.createdAt=firebase.firestore.FieldValue.serverTimestamp();
    }
    var wasAdmin=doc.exists&&doc.data().isAdmin===true;
    return ref.set(payload,{merge:true}).then(function(){
      isAdminUser=wasAdmin;
      curUser=id;localStorage.setItem("psq2curuser",id);
      updateAuthUI();renderMode();
      if(isAdminUser)loadMemberList();
    });
  });
}

$("loginSubmit").onclick=function(){
  var id=$("loginId").value.trim(),pw=$("loginPw").value;
  var msg=$("loginMsg");
  msg.textContent="";
  if(!id||!pw){msg.textContent="아이디와 비밀번호를 입력하세요.";return}
  if(!fbAuth){msg.textContent="서버 연결이 안 돼 로그인할 수 없습니다.";return}
  if(pw.length<6){msg.textContent="비밀번호는 6자 이상이어야 합니다.";return}
  var email=idToEmail(id);
  if(email.length>80){msg.textContent="아이디가 너무 깁니다.";return}
  var btn=$("loginSubmit");btn.disabled=true;btn.textContent="로그인 중…";
  fbAuth.signInWithEmailAndPassword(email,pw)
    .then(function(cred){
      return afterAuthSuccess(id,cred.user.uid).then(function(){
        $("loginModal").style.display="none";
      });
    })
    .catch(function(err){
      var m="로그인에 실패했습니다.";
      if(err&&err.code==="auth/user-not-found")m="존재하지 않는 아이디입니다.";
      else if(err&&(err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"))m="비밀번호가 일치하지 않습니다.";
      else if(err&&err.code==="auth/network-request-failed")m="네트워크 연결을 확인하세요.";
      else if(err&&err.code==="app/disabled")m=err.message;
      msg.textContent=m;
    })
    .then(function(){btn.disabled=false;btn.textContent="로그인";updateAuthUI()});
};

updateAuthUI();
renderMode();
if(fbAuth)fbAuth.onAuthStateChanged(function(u){
  if(!u&&curUser){curUser=null;localStorage.removeItem("psq2curuser");isAdminUser=false;updateAuthUI();renderMode();}
});

// ---------------- 관리자 패널 ----------------
if($("adminChangePwBtn"))$("adminChangePwBtn").onclick=function(){
  var oldPw=$("adminOldPw").value,newPw=$("adminNewPw").value;
  var msg=$("adminPwMsg");
  if(!oldPw||!newPw){msg.textContent="현재/새 비밀번호를 모두 입력하세요";return}
  if(newPw.length<6){msg.textContent="새 비밀번호는 6자 이상이어야 합니다";return}
  if(!fbAuth||!fbAuth.currentUser){msg.textContent="로그인 정보가 없습니다";return}
  msg.textContent="변경 중…";
  var credential=firebase.auth.EmailAuthProvider.credential(fbAuth.currentUser.email,oldPw);
  fbAuth.currentUser.reauthenticateWithCredential(credential)
    .then(function(){return fbAuth.currentUser.updatePassword(newPw)})
    .then(function(){
      msg.textContent="비밀번호가 변경됐습니다";
      $("adminOldPw").value="";$("adminNewPw").value="";
    })
    .catch(function(err){
      if(err&&(err.code==="auth/wrong-password"||err.code==="auth/invalid-credential"))msg.textContent="현재 비밀번호가 일치하지 않습니다";
      else msg.textContent="변경 실패: "+(err&&err.message?err.message:"오류");
    });
};

var secondaryAuth=null;
function getSecondaryAuth(){
  if(secondaryAuth)return secondaryAuth;
  var app2=null;
  for(var i=0;i<firebase.apps.length;i++){if(firebase.apps[i].name==="Secondary")app2=firebase.apps[i]}
  if(!app2)app2=firebase.initializeApp(FIREBASE_CONFIG,"Secondary");
  secondaryAuth=firebase.auth(app2);
  return secondaryAuth;
}

if($("adminAddMemberBtn"))$("adminAddMemberBtn").onclick=function(){
  var newId=$("adminNewId").value.trim(),newPw=$("adminNewMemberPw").value;
  var msg=$("adminAddMsg");
  if(!newId||!newPw){msg.textContent="아이디와 초기 비밀번호를 입력하세요";return}
  if(newPw.length<6){msg.textContent="초기 비밀번호는 6자 이상이어야 합니다";return}
  var email=idToEmail(newId);
  if(email.length>80){msg.textContent="아이디가 너무 깁니다";return}
  msg.textContent="추가 중…";
  var aux=getSecondaryAuth();
  aux.createUserWithEmailAndPassword(email,newPw).then(function(cred2){
    var newUid=cred2.user.uid;
    return db.collection("users").doc(newUid).set({
      name:newId,disabled:false,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      lastLogin:null
    },{merge:true}).then(function(){return aux.signOut()});
  }).then(function(){
    msg.textContent='"'+newId+'" 계정을 추가했습니다';
    $("adminNewId").value="";$("adminNewMemberPw").value="";
    loadMemberList();
  }).catch(function(err){
    if(err&&err.code==="auth/email-already-in-use")msg.textContent="이미 존재하는 아이디입니다";
    else if(err&&err.code==="auth/weak-password")msg.textContent="초기 비밀번호는 6자 이상이어야 합니다";
    else msg.textContent="추가 실패: "+(err&&err.message?err.message:"오류");
  });
};

function fmtDate(ts){
  if(!ts)return "기록 없음";
  try{
    var d=ts.toDate?ts.toDate():new Date(ts);
    var pad=function(n){return (n<10?"0":"")+n};
    return d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }catch(e){return "기록 없음"}
}

function loadMemberList(){
  var list=$("adminMemberList");
  if(!db){list.innerHTML='<div class="admin-sub">DB 연결 안 됨</div>';return}
  list.innerHTML='<div class="admin-sub">불러오는 중…</div>';
  db.collection("users").get().then(function(snap){
    var rows=[];
    snap.forEach(function(doc){
      var d=doc.data();
      rows.push({uid:doc.id,name:d.name||"(이름 없음)",lastLogin:d.lastLogin,disabled:!!d.disabled,isAdmin:!!d.isAdmin});
    });
    rows.sort(function(a,b){return (a.name||"").localeCompare(b.name||"")});
    $("adminMemberCount").textContent="("+rows.length+"개)";
    if(!rows.length){list.innerHTML='<div class="admin-sub">등록된 계정이 없습니다</div>';return}
    list.innerHTML="";
    rows.forEach(function(r){
      var row=document.createElement("div");
      row.className="admin-row"+(r.disabled?" is-disabled":"");
      var who=document.createElement("div");
      who.className="who";
      var b=document.createElement("b");
      b.textContent=r.name+(r.isAdmin?" (관리자)":"")+(r.disabled?" · 비활성":"");
      var span=document.createElement("span");
      span.textContent="마지막 접속: "+fmtDate(r.lastLogin);
      who.appendChild(b);who.appendChild(span);
      row.appendChild(who);
      if(!r.isAdmin){
        var btn=document.createElement("button");
        btn.type="button";
        btn.textContent=r.disabled?"활성화":"삭제(비활성화)";
        btn.onclick=function(){
          db.collection("users").doc(r.uid).set({disabled:!r.disabled},{merge:true}).then(loadMemberList);
        };
        row.appendChild(btn);
      }
      list.appendChild(row);
    });
  }).catch(function(err){
    list.innerHTML='<div class="admin-sub">불러오기 실패: '+(err&&err.message?err.message:"권한 없음")+'</div>';
  });
}

// PC 환경: 팝업(모달)이 열려있을 때 ESC로 닫기, Enter로 확인 버튼 실행
var MODAL_KEYS=[
  {id:"loginModal",confirm:"loginSubmit",cancel:"loginCancel"},
  {id:"pwModal",confirm:"pwSubmit",cancel:"pwCancel"},
  {id:"delModal",confirm:"delSubmit",cancel:"delCancel"}
];
document.addEventListener("keydown",function(e){
  for(var i=0;i<MODAL_KEYS.length;i++){
    var m=MODAL_KEYS[i];
    var el=$(m.id);
    if(el&&el.style.display==="flex"){
      if(e.key==="Escape"){
        e.preventDefault();
        el.style.display="none";
      }else if(e.key==="Enter"){
        if(document.activeElement&&document.activeElement.id===m.cancel)return;
        e.preventDefault();
        var btn=$(m.confirm);
        if(btn&&!btn.disabled)btn.click();
      }
      return;
    }
  }
});
</script>
